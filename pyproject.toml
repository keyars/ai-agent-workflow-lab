[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-workflow-lab"
version = "0.1.0"
description = "Production-oriented AI agent workflow infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
agent-lab = "apps.cli.main:main"

[tool.setuptools.packages.find]
include = ["apps*", "core*", "security*", "observability*", "agents*", "tools*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
